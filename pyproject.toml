[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qadiya"
version = "0.1.0"
description = "Classify-then-Dispatch for AI agents under constraint-driven canonical cases"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Moshe-ship" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qadiya*"]
